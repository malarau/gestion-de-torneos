[pytest]
# Añade la carpeta raíz del proyecto (donde reside 'flaskapp') al PYTHONPATH
python_files = test_*.py *_test.py
# Añade la carpeta actual ('.') al Python Path
# Esto le dice a Python que trate la carpeta raíz como un paquete de nivel superior.
pythonpath = .
log_cli = true
log_cli_level = INFO
filterwarnings = ignore