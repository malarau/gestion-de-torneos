services:
  web:
    # Un 'git clone' primero obviamente y build en la EC2.
    build: .

    restart: always  # Si la app crashea o se reinicia la instancia EC2, el contenedor revive solo.
    
    environment:
      # Ya no leemos desde un .env local 
      # Vamos a inyectar variables desde Parameter Store vía script, u otra alternativa.
      - SQLALCHEMY_DATABASE_URI=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      
    ports:
      - "80:5000"
      
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge